name: Build & Release

# Actions epinglees au dernier majeur tournant sur Node.js 24 : Node.js 20 est deprecie, les runners
# forcaient deja Node 24 en avertissant. Ces majeurs exigent un runner >= 2.327.1, ce que ubuntu-latest
# depasse largement. Les ruptures annoncees ne concernent pas ce workflow : le blocage des PR de fork
# (checkout v7) suppose pull_request_target ou workflow_run, et le televersement direct
# (upload-artifact v7) est optionnel, sur un parametre "archive" qu'on ne pose pas.

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'

jobs:
  debug:
    name: Build debug APK
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: trailog-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk

  release:
    name: Build & publish signed release APK
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 : le changelog (cf. Generate latest-release.json) parcourt l'historique entre le
      # tag precedent et celui-ci ; un checkout superficiel n'aurait ni les commits ni les tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install NDK
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973"

      - name: Decode release keystore
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      # Manifeste lu par l'app pour se savoir perimee (cf. update/UpdateManager). Publie comme asset de la
      # Release ci-dessous, et non commite sur main : GitHub le sert alors depuis son CDN via l'URL stable
      # /releases/latest/download/, sans quota (contrairement a l'API, 60 requetes/h par IP) et sans que la
      # CI ait a pousser sur main.
      - name: Generate latest-release.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # versionCode : meme calcul que build.gradle.kts (maj*10000 + min*100 + patch), c'est lui que
          # l'app compare. Les deux doivent rester d'accord.
          VERSION="${TAG#v}"
          IFS='.' read -r MAJ MIN PATCH <<< "$VERSION"
          VERSION_CODE=$(( MAJ * 10000 + MIN * 100 + PATCH ))
          # Nom d'APK fixe par androidComponents dans build.gradle.kts : trailog-<tag>.apk
          APK_URL="${{ github.server_url }}/${{ github.repository }}/releases/download/${TAG}/trailog-${TAG}.apk"
          # Le nom du fichier publie doit exister, sinon l'app telechargerait une URL morte.
          test -f "app/build/outputs/apk/release/trailog-${TAG}.apk"

          # Changelog affiche dans le dialogue in-app (cf. update/UpdateDialog) : sujets des commits depuis
          # le tag precedent, hors merges, en liste. Plafonne a 12 lignes pour tenir dans le dialogue ; si
          # c'est le tout premier tag, il n'y a pas de precedent et on liste depuis le debut de l'historique.
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          RANGE="${TAG}"
          [ -n "$PREV_TAG" ] && RANGE="${PREV_TAG}..${TAG}"
          CHANGELOG=$(git log --no-merges -n 12 --pretty=format:'- %s' "$RANGE")

          jq -n --arg v "$VERSION" --argjson c "$VERSION_CODE" \
                --arg d "$(date -u +%Y-%m-%d)" --arg u "$APK_URL" --arg cl "$CHANGELOG" \
                '{version:$v, versionCode:$c, releaseDate:$d, apkUrl:$u, changelog:$cl}' \
            > "$RUNNER_TEMP/latest-release.json"
          cat "$RUNNER_TEMP/latest-release.json"

      # La release est publiee sous l'identite du PAT fourni, et non sous celle du GITHUB_TOKEN de
      # l'execution : ce dernier appartient a github-actions[bot], qui apparaissait alors comme auteur de
      # chaque release. L'auteur d'une release ne peut pas etre change apres coup (l'API ne l'expose pas
      # en ecriture), il faut donc le fixer au moment de la creation.
      #
      # Secret RELEASE_PAT : jeton personnel fin de lc-4918, portee "Contents: read and write" sur ce seul
      # depot. S'il manque, l'etape echoue plutot que de retomber en silence sur le bot.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.RELEASE_PAT }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            ${{ runner.temp }}/latest-release.json
