# Application neutre pour tous les tests unitaires : la vraie (TrailogApp) initialise MapLibre au
# demarrage, dont les bibliotheques natives ne se chargent pas sur la JVM (UnsatisfiedLinkError).
# Aucun test unitaire n'a besoin de la carte ; ceux qui ont besoin du depot l'instancient eux-memes.
application=android.app.Application
# SDK unique : evite de rejouer chaque test sur toutes les versions d'Android (lenteur pure).
sdk=34
